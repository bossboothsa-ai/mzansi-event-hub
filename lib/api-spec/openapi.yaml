openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: South African event marketplace, ticketing, organiser operations and check-in API.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: marketplace
  - name: account
  - name: organiser
  - name: admin
  - name: checkout
  - name: tickets
  - name: legal
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
  /auth/register:
    post:
      operationId: registerAccount
      tags: [auth]
      summary: Create a customer account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterAccountInput" }
      responses:
        "201": { description: Account created and signed in }
        "409": { description: Email already registered }
  /auth/login:
    post:
      operationId: signInAccount
      tags: [auth]
      summary: Sign in to an account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignInAccountInput" }
      responses:
        "200": { description: Signed in }
        "401": { description: Invalid credentials }
  /auth/logout:
    post:
      operationId: signOutAccount
      tags: [auth]
      summary: Sign out and revoke the current session
      responses:
        "204": { description: Signed out }
  /marketplace/summary:
    get:
      operationId: getMarketplaceSummary
      tags: [marketplace]
      summary: Get marketplace highlights
      responses:
        "200":
          description: Marketplace summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplaceSummary"
  /events:
    get:
      operationId: listEvents
      tags: [marketplace]
      summary: Search approved public events
      parameters:
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: city
          schema: { type: string }
        - in: query
          name: category
          schema: { type: string }
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
      responses:
        "200":
          description: Matching public events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EventCard"
  /events/{eventId}:
    get:
      operationId: getEvent
      tags: [marketplace]
      summary: Get public event details
      parameters:
        - in: path
          name: eventId
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Event details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDetail"
        "404": { description: Event not found }
  /marketplace/reports:
    post:
      operationId: reportEvent
      tags: [marketplace]
      summary: Report a suspicious event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventReportInput"
      responses:
        "201":
          description: Report submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedResponse"
  /account/me:
    get:
      operationId: getCurrentAccount
      tags: [account]
      summary: Get the signed-in app account
      responses:
        "200":
          description: Current account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentAccount"
        "401": { description: Sign-in required }
  /account/preferences:
    patch:
      operationId: updateAccountPreferences
      tags: [account]
      summary: Update customer marketing consent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountPreferencesInput" }
      responses:
        "200": { description: Preferences updated }
  /organiser/application:
    get:
      operationId: getOrganiserApplication
      tags: [organiser]
      summary: Get the signed-in organiser application and review status
      responses:
        "200":
          description: Organiser application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganiserApplication"
        "404": { description: No application has been submitted }
    post:
      operationId: submitOrganiserApplication
      tags: [organiser]
      summary: Submit an organiser verification application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganiserApplicationInput"
      responses:
        "201":
          description: Application submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganiserApplication"
  /organiser/dashboard:
    get:
      operationId: getOrganiserDashboard
      tags: [organiser]
      summary: Get organiser performance and onboarding status
      responses:
        "200":
          description: Organiser dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganiserDashboard"
  /organiser/events:
    get:
      operationId: listOrganiserEvents
      tags: [organiser]
      summary: List the current organiser's events
      responses:
        "200":
          description: Organiser events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrganiserEvent"
    post:
      operationId: createOrganiserEvent
      tags: [organiser]
      summary: Create an event draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventInput"
      responses:
        "201":
          description: Event draft created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganiserEvent"
  /organiser/events/{eventId}:
    patch:
      operationId: updateOrganiserEvent
      tags: [organiser]
      summary: Update or submit an owned event
      parameters:
        - in: path
          name: eventId
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventInput"
      responses:
        "200":
          description: Updated event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganiserEvent"
        "403": { description: Event is not editable by this organiser }
  /organiser/events/{eventId}/sales:
    get:
      operationId: getOrganiserEventSales
      tags: [organiser]
      summary: Get sales and attendee data for an owned event
      parameters:
        - in: path
          name: eventId
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Event sales summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventSales"
  /organiser/events/{eventId}/communications:
    get:
      operationId: listEventCommunications
      tags: [organiser]
      summary: List communications for an owned event
      parameters:
        - in: path
          name: eventId
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Event communications
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/EventCommunication" } }
    post:
      operationId: createEventCommunication
      tags: [organiser]
      summary: Queue an event communication for eligible ticket holders
      parameters:
        - in: path
          name: eventId
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventCommunicationInput" }
      responses:
        "201": { description: Communication queued }
  /organiser/events/{eventId}/check-ins:
    get:
      operationId: listEventCheckIns
      tags: [organiser, tickets]
      summary: List recent check-ins for an event
      parameters:
        - in: path
          name: eventId
          required: true
          schema: { type: integer }
      responses:
        "200": { description: Event check-in history }
  /staff/events:
    get:
      operationId: listAssignedStaffEvents
      tags: [tickets]
      summary: List events available to the signed-in event staff member
      responses:
        "200": { description: Assigned events }
  /organiser/events/{eventId}/staff:
    get:
      operationId: listEventStaff
      tags: [organiser]
      summary: List event staff assigned to an owned event
      parameters:
        - in: path
          name: eventId
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Event staff assignments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StaffAssignment" }
    post:
      operationId: assignEventStaff
      tags: [organiser]
      summary: Assign a registered user to check in tickets
      parameters:
        - in: path
          name: eventId
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StaffAssignmentInput" }
      responses:
        "201":
          description: Event staff assigned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffAssignment" }
        "404": { description: Event or registered user not found }
  /organiser/events/{eventId}/staff/{userId}:
    delete:
      operationId: removeEventStaff
      tags: [organiser]
      summary: Remove staff access from an event
      parameters:
        - in: path
          name: eventId
          required: true
          schema: { type: integer }
        - in: path
          name: userId
          required: true
          schema: { type: string }
      responses:
        "204": { description: Staff access removed }
  /organiser/payfast:
    get:
      operationId: getOrganiserPaymentSetup
      tags: [organiser]
      summary: Get organiser PayFast sandbox setup status
      responses:
        "200":
          description: Payment setup status; no credentials are returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentSetupStatus"
    put:
      operationId: saveOrganiserPaymentSetup
      tags: [organiser]
      summary: Save organiser PayFast sandbox merchant details
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentSetupInput"
      responses:
        "200":
          description: Payment setup saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentSetupStatus"
  /organiser/documents:
    post:
      operationId: uploadOrganiserDocument
      tags: [organiser]
      summary: Upload a private organiser verification document
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/DocumentUploadInput"
      responses:
        "201":
          description: Document stored privately
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentUploadResult"
  /admin/reports:
    get:
      operationId: listEventReports
      tags: [admin]
      summary: List customer event reports
      responses:
        "200":
          description: Event reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EventReport"
  /admin/reports/{reportId}/decision:
    patch:
      operationId: decideEventReport
      tags: [admin]
      summary: Resolve an event report
      parameters:
        - in: path
          name: reportId
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportDecisionInput"
      responses:
        "200":
          description: Updated event report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventReport"
  /admin/onboarding-fee:
    get:
      operationId: getOnboardingFee
      tags: [admin]
      summary: Get the configured once-off organiser onboarding fee
      responses:
        "200":
          description: Onboarding fee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingFee"
    put:
      operationId: setOnboardingFee
      tags: [admin]
      summary: Set the organiser onboarding fee in ZAR
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingFeeInput"
      responses:
        "200":
          description: Updated onboarding fee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingFee"
  /admin/onboarding-payments:
    get:
      operationId: listOnboardingPayments
      tags: [admin]
      summary: List organiser onboarding payment statuses
      responses:
        "200":
          description: Onboarding payment statuses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OnboardingPayment"
  /admin/audit-logs:
    get:
      operationId: listAuditLogs
      tags: [admin]
      summary: List recent platform audit entries
      responses:
        "200":
          description: Recent audit entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditLog"
  /admin/documents/{documentId}:
    get:
      operationId: downloadVerificationDocument
      tags: [admin]
      summary: Download a private verification document
      parameters:
        - in: path
          name: documentId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Private verification document
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404": { description: Document not found }
  /admin/onboarding-payments/{organiserId}:
    patch:
      operationId: updateOnboardingPayment
      tags: [admin]
      summary: Record a reconciled organiser onboarding payment status
      parameters:
        - in: path
          name: organiserId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OnboardingPaymentUpdateInput" }
      responses:
        "200":
          description: Updated onboarding payment record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingPayment" }
  /admin/dashboard:
    get:
      operationId: getAdminDashboard
      tags: [admin]
      summary: Get platform statistics and review counts
      responses:
        "200":
          description: Admin dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDashboard"
  /admin/applications:
    get:
      operationId: listOrganiserApplications
      tags: [admin]
      summary: List organiser applications for review
      responses:
        "200":
          description: Organiser applications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrganiserApplication"
  /admin/applications/{applicationId}/decision:
    patch:
      operationId: decideOrganiserApplication
      tags: [admin]
      summary: Approve or reject an organiser application
      parameters:
        - in: path
          name: applicationId
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewDecisionInput"
      responses:
        "200":
          description: Updated application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganiserApplication"
  /admin/events:
    get:
      operationId: listAdminEvents
      tags: [admin]
      summary: List events across all organisers
      responses:
        "200":
          description: Admin event list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminEvent"
  /admin/events/{eventId}/decision:
    patch:
      operationId: decideEvent
      tags: [admin]
      summary: Approve, reject, or suspend an event
      parameters:
        - in: path
          name: eventId
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventDecisionInput"
      responses:
        "200":
          description: Updated event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEvent"
  /checkout:
    post:
      operationId: createCheckout
      tags: [checkout]
      summary: Start a sandbox purchase with the event organiser's merchant account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutInput"
      responses:
        "201":
          description: Sandbox checkout initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutSession"
        "409": { description: "Event, ticket, or organiser payment setup is unavailable" }
  /payments/payfast/itn:
    post:
      operationId: receivePayfastItn
      tags: [checkout]
      summary: Receive and verify a PayFast sandbox ITN notification
      description: Server-side verification is required before any ticket is issued.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/PayfastItnInput"
      responses:
        "200": { description: Notification accepted or safely ignored }
        "400": { description: Invalid notification }
  /tickets:
    get:
      operationId: listCustomerTickets
      tags: [tickets]
      summary: List tickets owned by the signed-in customer
      responses:
        "200":
          description: Customer tickets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Ticket"
  /check-in/scan:
    post:
      operationId: scanTicket
      tags: [tickets]
      summary: Validate and check in a ticket for an event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckInInput"
      responses:
        "200":
          description: Check-in result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckInResult"
  /legal/{slug}:
    get:
      operationId: getLegalDocument
      tags: [legal]
      summary: Get a draft legal information page
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
            enum: [privacy, customer-terms, organiser-agreement, refunds, cancellations]
      responses:
        "200":
          description: Draft legal document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalDocument"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    EventCard:
      type: object
      required: [id, title, city, venue, startsAt, category, imageUrl, minPrice, currency, organiserName, status]
      properties:
        id: { type: integer }
        title: { type: string }
        city: { type: string }
        venue: { type: string }
        startsAt: { type: string, format: date-time }
        category: { type: string }
        imageUrl: { type: ["string", "null"] }
        minPrice: { type: number }
        currency: { type: string, enum: [ZAR] }
        organiserName: { type: string }
        status: { type: string, enum: [draft, pending, more_information_required, approved, published, rejected, suspended, completed, cancelled] }
    TicketCategory:
      type: object
      required: [id, name, description, price, quantityAvailable, salesStart, salesEnd]
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string }
        price: { type: number }
        quantityAvailable: { type: integer }
        salesStart: { type: ["string", "null"], format: date-time }
        salesEnd: { type: ["string", "null"], format: date-time }
    EventDetail:
      allOf:
        - $ref: "#/components/schemas/EventCard"
        - type: object
          required: [description, organiserVerified, ticketCategories]
          properties:
            description: { type: string }
            organiserVerified: { type: boolean }
            ticketCategories:
              type: array
              items: { $ref: "#/components/schemas/TicketCategory" }
    MarketplaceSummary:
      type: object
      required: [events, cities, categories]
      properties:
        events:
          type: array
          items: { $ref: "#/components/schemas/EventCard" }
        cities:
          type: array
          items: { type: string }
        categories:
          type: array
          items: { type: string }
    EventReportInput:
      type: object
      required: [eventId, reason, details, contactEmail]
      properties:
        eventId: { type: integer }
        reason: { type: string, enum: [misleading, suspicious-payment, unsafe, duplicate, other] }
        details: { type: string, minLength: 10, maxLength: 2000 }
        contactEmail: { type: string, format: email }
    EventReport:
      type: object
      required: [id, eventId, eventTitle, reason, details, contactEmail, status, createdAt]
      properties:
        id: { type: integer }
        eventId: { type: integer }
        eventTitle: { type: string }
        reason: { type: string }
        details: { type: string }
        contactEmail: { type: string, format: email }
        status: { type: string, enum: [open, resolved, dismissed] }
        createdAt: { type: string, format: date-time }
    ReportDecisionInput:
      type: object
      required: [decision, reviewNote]
      properties:
        decision: { type: string, enum: [resolve, dismiss] }
        reviewNote: { type: string, maxLength: 2000 }
    CreatedResponse:
      type: object
      required: [id, status]
      properties:
        id: { type: integer }
        status: { type: string }
    RegisterAccountInput:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        email: { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 128 }
    SignInAccountInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 128 }
    AccountPreferencesInput:
      type: object
      required: [marketingConsent]
      properties:
        marketingConsent: { type: boolean }
    CurrentAccount:
      type: object
      required: [id, name, email, role, organiserStatus]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [customer, organiser, admin, event_staff] }
        organiserStatus: { type: string, enum: [not_started, pending, approved, rejected, suspended] }
        organisationName: { type: ["string", "null"] }
        marketingConsent: { type: boolean }
    OrganiserApplicationInput:
      type: object
      required: [accountType, legalName, contactEmail, phone, organisationName, city, registrationNumber, authenticityAccepted, agreementAccepted]
      properties:
        accountType: { type: string, enum: [individual, business] }
        legalName: { type: string, minLength: 2 }
        contactEmail: { type: string, format: email }
        phone: { type: string, minLength: 7 }
        organisationName: { type: string, minLength: 2 }
        city: { type: string, minLength: 2 }
        registrationNumber: { type: ["string", "null"] }
        identityDocumentPath: { type: ["string", "null"] }
        businessDocumentPath: { type: ["string", "null"] }
        authenticityAccepted: { type: boolean, const: true }
        agreementAccepted: { type: boolean, const: true }
    OrganiserApplication:
      type: object
      required: [id, legalName, contactEmail, organisationName, accountType, status, paymentStatus, createdAt]
      properties:
        id: { type: integer }
        legalName: { type: string }
        contactEmail: { type: string, format: email }
        phone: { type: string }
        city: { type: string }
        organisationName: { type: string }
        accountType: { type: string, enum: [individual, business] }
        registrationNumber: { type: ["string", "null"] }
        identityDocumentPath: { type: ["string", "null"] }
        businessDocumentPath: { type: ["string", "null"] }
        status: { type: string, enum: [pending, more_information_required, approved, rejected, suspended] }
        paymentStatus: { type: string, enum: [pending, paid, waived] }
        reviewNote: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
    OrganiserDashboard:
      type: object
      required: [status, paymentStatus, eventCount, ticketsSold, revenue, events]
      properties:
        status: { type: string, enum: [not_started, pending, approved, rejected, suspended] }
        paymentStatus: { type: string, enum: [not_due, pending, paid, waived] }
        eventCount: { type: integer }
        ticketsSold: { type: integer }
        revenue: { type: number }
        events:
          type: array
          items: { $ref: "#/components/schemas/OrganiserEvent" }
    EventInput:
      type: object
      required: [title, description, city, venue, startsAt, category, imageUrl, authenticityAccepted, organiserTermsAccepted, ticketCategories, submitForReview]
      properties:
        title: { type: string, minLength: 4, maxLength: 120 }
        description: { type: string, minLength: 20, maxLength: 8000 }
        city: { type: string }
        venue: { type: string }
        startsAt: { type: string, format: date-time }
        category: { type: string }
