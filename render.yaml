# =============================================================================
# Mzansi Event Hub (Out There ZA) - Render Blueprint (single web service)
# =============================================================================
# One Node web service serves BOTH the API (/api/*) and the built React
# frontend (static + SPA fallback). This is simpler and cheaper than running
# two services, and matches how a Render "New Web Service from repo" deploy
# behaves.
#
# Usage:
#   1. Push this repo to GitHub.
#   2. In Render, create a PostgreSQL database and copy its Internal Database URL.
#   3. New -> Blueprint -> connect the repo (Render reads this file), OR
#      New -> Web Service -> point at the repo with these settings:
#        Build Command: pnpm install --frozen-lockfile && pnpm run build
#        Start Command: pnpm run start
#   4. Fill in the secret env vars (marked sync:false) in the Render dashboard.
#   5. Apply the DB schema from the Render Shell:
#        pnpm --filter @workspace/db run push
#   6. Bootstrap the first admin (see DEPLOYMENT.md section 4.5).
# =============================================================================

services:
  - type: web
    name: mzansi-event-hub
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm run build
    startCommand: pnpm run start
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      # Render injects PORT automatically; the server reads process.env.PORT.
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: ADMIN_BOOTSTRAP_TOKEN
        sync: false
      - key: PAYFAST_ENCRYPTION_SECRET
        sync: false
      - key: PAYFAST_NOTIFY_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: Out There ZA <onboarding@resend.dev>
      - key: WEB_ORIGIN
        sync: false
      - key: PRIVATE_DOCUMENTS_DIR
        value: /var/data/private-documents
    disk:
      name: mzansi-documents
      mountPath: /var/data
      sizeGB: 1